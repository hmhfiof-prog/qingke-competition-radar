# 竞赛雷达 · 静态版自动发布到 GitHub Pages
# 使用方法：新建公开仓库后，在仓库 Settings → Pages 中把 Source 选为 "GitHub Actions"，
# 然后把本仓库源码推送过去，即可自动上线。
name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: competition-tracker
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4