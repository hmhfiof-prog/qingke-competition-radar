# 青科竞赛雷达 · 静态版自动发布到 GitHub Pages
# 使用方法：仓库 Settings → Pages → Source 选择 "GitHub Actions"，提交本文件后会自动上线。
# 若在 Pages 设置里选择 "Deploy from a branch"（main 分支 / 根目录），则无需本脚本。
name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
